# Production Profile Configuration
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod

jwt:
  cookie:
    secure: true # HTTPS-only cookies in production

# Production database settings
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.aboff.core.security: INFO
    com.aboff.core.exception: INFO
    com.aboff.core.service.AuthenticationService: INFO