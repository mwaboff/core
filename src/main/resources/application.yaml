spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: core
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, email
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:heartandfear}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT configuration
jwt:
  secret: ${JWT_SECRET:change-this-to-256-bit-secret-in-production-must-be-long-enough-for-hmac-sha}
  expiration: 2592000000 # 30 days in milliseconds (30 * 24 * 60 * 60 * 1000)
  cookie:
    name: AUTH_TOKEN
    http-only: true
    secure: ${JWT_COOKIE_SECURE:false} # false in dev, true in prod
    same-site: Lax
    max-age: 2592000 # 30 days in seconds (30 * 24 * 60 * 60)

# Application-specific configuration
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  user:
    default-avatar-url: https://api.dicebear.com/7.x/avatars/svg?seed=default
    default-timezone: UTC

# Daggerheart game configuration
daggerheart:
  character:
    defaults:
      level:
        min: 1
        max: 10
        starting: 1
      hit-points:
        min: 0
        starting: 6
      stress:
        min: 0
        starting: 6
      hope:
        min: 0
        starting: 2
      armor:
        min: 0
        starting: 0
      gold:
        min: 0
        starting: 0
      trait-modifier:
        min: -3
        max: 3

# Logging configuration for troubleshooting authentication issues
# Set these to INFO in production
logging:
  level:
    com.aboff.core.security: DEBUG
    com.aboff.core.exception: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
