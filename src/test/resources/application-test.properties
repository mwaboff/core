# Test Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/heartandfear
spring.datasource.username=postgres
spring.datasource.password=password

# JWT Configuration for Tests
jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-algorithm-used-in-testing
jwt.expiration=3600000
jwt.cookie.name=AUTH_TOKEN
jwt.cookie.http-only=true
jwt.cookie.secure=false
jwt.cookie.same-site=Strict
jwt.cookie.max-age=3600

# Security Configuration
application.security.max-failed-attempts=5
application.security.lockout-duration-minutes=30
application.security.failed-attempt-window-minutes=15
application.security.password.min-length=8
application.security.password.require-uppercase=true
application.security.password.require-lowercase=true
application.security.password.require-digit=true
application.security.password.require-special=true

# User Defaults
application.user.default-avatar-url=https://api.dicebear.com/7.x/avatars/svg?seed=default
application.user.default-timezone=UTC

# Disable Flyway for tests (using Hibernate DDL auto-creation)
spring.flyway.enabled=false

# Hibernate - auto-create schema from entities for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
