# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration for Tests
jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-algorithm-used-in-testing
jwt.expiration=3600000
jwt.cookie.name=AUTH_TOKEN
jwt.cookie.http-only=true
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
jwt.cookie.max-age=3600

# OAuth2 Configuration for Tests (dummy values to satisfy Spring validation)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# User Defaults
application.user.default-avatar-url=https://api.dicebear.com/7.x/avatars/svg?seed=default
application.user.default-timezone=UTC
application.frontend.base-url=http://localhost:4200

# Disable Flyway for tests (using Hibernate DDL auto-creation)
spring.flyway.enabled=false

# Hibernate - auto-create schema from entities for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
